[project]
name = "cascade-control"
version = "0.1.0"
description = "Локальная панель управления каскадом VPN Cascade Control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0",
  "pydantic>=2.9",
  "cryptography>=43",
  "paramiko>=3.5",
  "qrcode>=8",
  "pillow>=10",
]

[project.optional-dependencies]
windows = ["pywebview>=5.0", "pyinstaller>=6.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cascade-panel = "cascade_panel.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cascade_panel*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
