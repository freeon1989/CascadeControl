name: tests

on:
  push:
  pull_request:

jobs:
  python-and-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests
        run: |
          python -m pip install -r requirements.txt
          python -m pytest
      - name: Agent tests
        working-directory: agent
        run: go test ./...
      - name: Web build
        working-directory: web
        run: |
          npm ci
          npm run build

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build exe
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CascadeControl-exe
          path: dist/CascadeControl/
